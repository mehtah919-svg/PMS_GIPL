}
function fmtDate(d){
  if(!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});

/* ---- Storage layer — auto-switches between Claude's artifact storage (preview)
   and Firebase Firestore (team-shared, when deployed outside Claude). ---- */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out waiting for: '+label+' — check that Firestore Database is created (not just the web app registered) in your Firebase project.')), ms))
  ]);
}
async function loadProjects(){
  try{
    if(HAS_ARTIFACT_STORAGE){
      try{
        const r = await window.storage.get('projects', false);
        state.projects = r ? JSON.parse(r.value) : [];
      }catch(notFound){ state.projects = []; } // key doesn't exist yet — normal on first load, not an error
    } else if(db){
      const snap = await withTimeout(db.collection('meta').doc('projects').get(), 6000, 'loadProjects');
      state.projects = snap.exists ? (snap.data().list || []) : [];
    } else { state.projects = []; }

async function loadPData(id){

/* ---- Activity planning + progress math ---- */
function taskCalc(t){
  const qty = Number(t.qty)||0;
  const outputRate = Number(t.outputRate)||0;
  const resources = Number(t.resources)||0;
  const dailyTarget = outputRate*resources;
  const start = new Date(t.start);
  const plannedDays = dailyTarget>0 ? Math.ceil(qty/dailyTarget) : 0;
  const plannedEnd = new Date(start); plannedEnd.setDate(plannedEnd.getDate() + Math.max(0,plannedDays-1));

  const logs = (t.logs||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const cumDone = logs.reduce((s,l)=>s+(Number(l.qty)||0),0);
  const percent = qty>0 ? Math.min(100, Math.round((cumDone/qty)*1000)/10) : 0;

  const today = new Date(); today.setHours(0,0,0,0);
  const startMid = new Date(start); startMid.setHours(0,0,0,0);
  const daysElapsed = Math.max(1, Math.round((today-startMid)/86400000)+1);
  const actualRate = daysElapsed>0 ? cumDone/daysElapsed : 0;
  const remainingQty = Math.max(0, qty-cumDone);

  let projectedEnd = null, projectedDaysRemaining = null;
  if(remainingQty<=0){
    projectedEnd = logs.length ? new Date(logs[logs.length-1].date) : plannedEnd;
  } else if(actualRate>0){
    projectedDaysRemaining = Math.ceil(remainingQty/actualRate);
    projectedEnd = new Date(today); projectedEnd.setDate(projectedEnd.getDate()+projectedDaysRemaining);
  }

  const targetCumToday = dailyTarget>0 ? Math.min(qty, dailyTarget*daysElapsed) : 0;
  const variance = cumDone - targetCumToday;

  const daysLeftPlanned = Math.max(0, Math.round((plannedEnd-today)/86400000));
  const catchUpDaily = (remainingQty>0 && daysLeftPlanned>0) ? Math.ceil((remainingQty/daysLeftPlanned)*10)/10 : null;

  let statusLabel='ontrack', statusText='On track';
  if(remainingQty<=0){ statusLabel='ahead'; statusText='Completed'; }
  else if(variance < -0.001){ statusLabel='behind'; statusText='Behind schedule'; }
  else if(variance > 0.001){ statusLabel='ahead'; statusText='Ahead of target'; }

  return {qty, outputRate, resources, dailyTarget, plannedDays, plannedEnd, cumDone, percent,
    daysElapsed, actualRate, remainingQty, projectedEnd, targetCumToday, variance,
    daysLeftPlanned, catchUpDaily, statusLabel, statusText};
}

  {kw:['waterproofing'], rate:20, res:1},
  {kw:['coping'], rate:15, res:1},
  {kw:['drain'], rate:15, res:1},
];
const UNIT_FALLBACK_RATE = {cum:8, sqm:30, rmt:20, sqft:150, kg:500, mt:0.5, nos:10, ton:0.5, cft:200};
function guessOutputRate(itemName, unit){
  const n = (itemName||'').toLowerCase();
  for(const r of STD_OUTPUT_RATES){ if(r.kw.some(k=>n.includes(k))) return {outputRate:r.rate, resources:r.res}; }
  const u = (unit||'').toLowerCase().trim();
  const fallback = UNIT_FALLBACK_RATE[u] ?? 10;
  return {outputRate:fallback, resources:1};
}

function getStage(itemName, projectType){
  const n = (itemName||'').toLowerCase();
  const table = STAGE_ORDER_BY_TYPE[projectType];
  if(table){ for(const s of table){ if(s.kw.some(k=>n.includes(k))) return s.stage; } }
  for(const s of STAGE_ORDER_GENERIC){ if(s.kw.some(k=>n.includes(k))) return s.stage; }
  return 50; // unknown items scheduled after known ones, in BOQ order among themselves
}
/* ---- Curing / setting lag (days) before the NEXT dependent trade can start ----
   Practical site lag, not full 28-day design curing — matches how Primavera/MSP
   model lag between predecessor-finish and successor-start (FS + lag). Same across
   project types since it's a material property, not a project-type property. */
const CURING_LAG = [
  {kw:['dlc'], lag:1},
  {kw:['pcc','bedding'], lag:2},
  {kw:['footing','foundation','rcc column','plinth beam','coping','lintel','roof slab','slab','beam','base slab','stem','rcc wall','top slab'], lag:3},
  {kw:['brick work','brickwork','brick'], lag:1},
  {kw:['plaster'], lag:2},
];
function getCuringLag(itemName){
  const n = (itemName||'').toLowerCase();
  for(const c of CURING_LAG){ if(c.kw.some(k=>n.includes(k))) return c.lag; }
  return 0;
}
function orderedBoqItems(pd, projectType){
  return (pd.boq||[]).filter(it=>Number(it.qty)>0)
    .map((it,idx)=>({it, idx, stage:getStage(it.item, projectType)}))
    .sort((a,b)=> a.stage-b.stage || a.idx-b.idx)
    .map(x=>x.it);
}


function budgetSummary(pdata){
  let est=0, act=0;
  (pdata.boq||[]).forEach(it=>{ est += (Number(it.qty)||0)*(Number(it.rate)||0); act += (Number(it.aqty)||0)*(Number(it.arate)||0); });
  return {est, act, pct: est>0 ? Math.min(100, Math.round((act/est)*100)) : 0};
}
function scheduleSummary(pdata){
  const tasks = pdata.tasks||[];
  if(!tasks.length) return {pct:0, delayed:false};
  let sum=0, behind=0;
  tasks.forEach(t=>{ const c=taskCalc(t); sum+=c.percent; if(c.statusLabel==='behind') behind++; });
  return {pct: Math.round(sum/tasks.length), delayed: behind>0};
}
function billingSummary(pdata){
  let totEst=0, totBilled=0;
  (pdata.boq||[]).forEach(it=>{
    const est = (Number(it.qty)||0)*(Number(it.rate)||0);
    const bs = boqBilledSummary(pdata, it.id);
    totEst += est;
    totBilled += bs.qty*(Number(it.rate)||0);
  });
  return {totEst, totBilled, pct: totEst>0 ? Math.round((totBilled/totEst)*100) : 0};
}

function gaugeSVG(pct, color){
  const r=26, c=2*Math.PI*r;
  const off = c - (Math.min(100,Math.max(0,pct))/100)*c;
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" stroke="var(--line)" stroke-width="6" fill="none"/>
    <circle cx="32" cy="32" r="${r}" stroke="${color}" stroke-width="6" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

/* ---------------- Trash: 7-day recoverable delete history (admin only) ---------------- */
const TRASH_RETENTION_MS = 7*24*60*60*1000;
function trashPush(pd, type, data, label){
  if(!data) return;
  if(!pd.trash) pd.trash = [];
  pd.trash.push({id:uid(), type, data, label: label||'Item', deletedAt:new Date().toISOString(), deletedBy:whoami()});
}
function purgeOldTrash(pd){
  if(!pd.trash) return;
  pd.trash = pd.trash.filter(t=> (Date.now()-new Date(t.deletedAt).getTime()) < TRASH_RETENTION_MS);
}
function daysLeft(deletedAt){
  const ms = TRASH_RETENTION_MS - (Date.now()-new Date(deletedAt).getTime());
  return Math.max(0, Math.ceil(ms/86400000));
}
function restoreTrashData(pd, item){
  const d = item.data;
  if(item.type==='boq') pd.boq.push(d);
  else if(item.type==='task') pd.tasks.push(d);
  else if(item.type==='log'){ const t = pd.tasks.find(x=>x.id===d.taskId); if(t) t.logs.push(d.log); }
  else if(item.type==='resource') pd.resources.push(d);
  else if(item.type==='dpr') pd.dpr.push(d);
  else if(item.type==='billing') pd.billing.push(d);
}
function renderTrashTab(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  const pd = state.pdata[p.id];
  purgeOldTrash(pd);
  const items = (pd.trash||[]).slice().sort((a,b)=> b.deletedAt.localeCompare(a.deletedAt));
  const rows = items.map(t=>`<tr>
    <td>${esc(t.type)}</td><td>${esc(t.label)}</td>
    <td style="color:var(--ink-soft);font-size:12px">${esc(t.deletedBy)}</td>
    <td style="color:var(--ink-soft);font-size:12px">${fmtDate(t.deletedAt)}</td>
    <td class="num">${daysLeft(t.deletedAt)}d left</td>
    <td><button class="btn btn-sm" onclick="restoreFromTrash('${t.id}')">Restore</button></td>
  </tr>`).join('');
  return `<div class="topbar"><div><div class="page-title">Trash — ${esc(p.name)}</div><div class="page-sub">Deleted items stay recoverable for 7 days</div></div>${projectSelectorHTML()}</div>
    ${items.length ? `<table><thead><tr><th>Type</th><th>Item</th><th>Deleted by</th><th>Deleted on</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Nothing in trash.</div>'}`;
}
window.restoreFromTrash = async function(trashId){
  const pd = state.pdata[state.currentProjectId];
  const item = pd.trash.find(t=>t.id===trashId);
  if(!item) return;
  restoreTrashData(pd, item);
  pd.trash = pd.trash.filter(t=>t.id!==trashId);
  await savePData(state.currentProjectId);
  render();
};

/* ---------------- Undo (session-only, for accidental deletes) ---------------- */
function pushUndo(type, projectId, data, restoreFn, label){
  if(!data) return;
  const record = {type, projectId, data, restoreFn, label: label || (data.name || data.item || 'Item'), rid: uid()};
  state.lastDeleted = record;
  setTimeout(()=>{ if(state.lastDeleted && state.lastDeleted.rid===record.rid){ state.lastDeleted = null; render(); } }, 12000);
}
window.undoDelete = async function(){
  const u = state.lastDeleted;
  if(!u) return;
  state.lastDeleted = null;
  u.restoreFn(u.data);
  if(u.type==='project'){ await saveProjects(); if(u.data.pdata) await savePData(u.projectId); }
  else { await savePData(u.projectId); }
  render();
};
function undoBannerHTML(){
  if(!state.lastDeleted) return '';
  return `<div class="card" style="background:var(--warn-soft);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:14px">
    <span style="font-size:13px">"${esc(state.lastDeleted.label)}" deleted.</span>
    <button class="btn btn-sm" onclick="undoDelete()">Undo</button>
  </div>`;
}

/* ---------------- Backup: export / import all data as JSON ---------------- */
window.downloadBackup = function(){
  const payload = {exportedAt: new Date().toISOString(), projects: state.projects, pdata: state.pdata};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'siteboard-backup-'+isoDate(new Date())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
window.triggerImportBackup = function(){ document.getElementById('backup_file_input').click(); };
window.handleImportBackup = async function(input){
  const file = input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload.projects || !payload.pdata) throw new Error('This file does not look like a SITEBOARD backup.');
    if(!confirm('This will REPLACE all current projects with the ones in this backup file. Continue?')) return;
    state.projects = payload.projects;
    state.pdata = payload.pdata;
    await saveProjects();
    for(const p of state.projects){ await savePData(p.id); }
    alert('Backup restored.');
    render();
  }catch(e){ alert('Could not import backup: '+e.message); }
  input.value = '';
};

  if(removedProject){

    state.globalTrash.push({id:uid(), project:removedProject, pdata:removedPData, deletedAt:new Date().toISOString(), deletedBy:whoami()});

/* ---------------- Schedule (activity list) ---------------- */
function todayTargetInfo(t,c){
  if(c.remainingQty<=0) return '';
  if(new Date(t.start) > new Date()) return `<span style="color:var(--ink-faint)">Not started yet</span>`;
  const today = isoDate(new Date());
  const log = (t.logs||[]).find(l=>l.date===today);
  if(!log) return `<span style="color:var(--warn)">Today's target not logged (${c.dailyTarget} ${esc(t.unit)} due)</span>`;
  const met = Number(log.qty) >= c.dailyTarget - 0.001;
  return met
    ? `<span style="color:var(--good)">✓ Today's target met — ${log.qty}/${c.dailyTarget} ${esc(t.unit)}</span>`
    : `<span style="color:var(--warn)">✗ Today's target missed — ${log.qty}/${c.dailyTarget} ${esc(t.unit)}</span>`;
}
function renderScheduleTab(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  const pd = state.pdata[p.id];
  const tasks = pd.tasks||[];
  let minS=null,maxE=null;
  const calcs = tasks.map(t=>({t, c:taskCalc(t)}));
  calcs.forEach(({t,c})=>{ const s=new Date(t.start); const e=c.projectedEnd||c.plannedEnd;
    if(!minS||s<minS) minS=s; if(!maxE||e>maxE) maxE=e; });
  const span = (minS&&maxE) ? Math.max(1,(maxE-minS)/86400000) : 1;
  const rows = calcs.map(({t,c})=>{
    const s=new Date(t.start);
    const barEnd = c.projectedEnd || c.plannedEnd;
    const left = minS ? ((s-minS)/86400000/span)*100 : 0;
    const width = Math.max(2, ((barEnd-s)/86400000/span)*100);
    const barClass = c.statusLabel==='ahead' && c.remainingQty<=0 ? 'done' : (c.statusLabel==='behind' ? 'overdue' : '');
    const cpBadge = t.critical ? `<span title="Critical path — a delay here pushes back the whole project" style="font-size:9px;font-weight:700;color:#fff;background:var(--warn,#c0392b);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:middle;">CP</span>`
      : (t.floatDays>0 ? `<span style="font-size:9px;color:var(--ink-faint);margin-left:6px;">float ${t.floatDays}d</span>` : '');
    return `<div class="gantt-row" onclick="openTask('${t.id}')">
      <div class="gr-top">
        <span class="task-name">${esc(t.name)}${cpBadge}</span>
        <span class="badge ${c.statusLabel}">${c.statusText}</span>
      </div>
      <div class="gr-meta">
        <span>${fmtDate(t.start)} → ${fmtDate(barEnd)}${c.projectedEnd && c.projectedEnd>c.plannedEnd ? ' <span style="color:var(--warn)">(planned '+fmtDate(c.plannedEnd)+')</span>' : ''}</span>
        <span>·</span><span>${todayTargetInfo(t,c)}</span>
      </div>
      <div class="gantt-track"><div class="gantt-bar ${barClass}" style="left:${left}%;width:${width}%${t.critical?';outline:1.5px solid var(--warn,#c0392b)':''}"></div></div>
      <div class="gr-foot"><span class="pct">${c.percent}% done — ${c.cumDone}/${t.qty} ${esc(t.unit)}</span></div>
    </div>`;
  }).join('');
  return `<div class="topbar"><div><div class="page-title">Schedule — ${esc(p.name)}</div><div class="page-sub">${tasks.length} activities · click one to plan &amp; log daily progress</div></div>${projectSelectorHTML()}</div>
    <div class="card">
      <div class="toolbar"><b style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;">Add activity</b></div>
      <div class="form-grid">
        <div><label>Activity name</label><input id="t_name" placeholder="e.g. RCC Column Casting"/></div>
        <div><label>Total quantity</label><input id="t_qty" type="number" placeholder="e.g. 120"/></div>
        <div><label>Unit</label><input id="t_unit" placeholder="cum / sqm / nos"/></div>
        <div><label>Output / resource / day</label><input id="t_orate" type="number" placeholder="e.g. 2"/></div>
        <div><label>Resources deployed</label><input id="t_res" type="number" placeholder="e.g. 6"/></div>
        <div><label>Start date</label><input id="t_start" type="date"/></div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px">Duration and daily target are calculated automatically: qty ÷ (output rate × resources).</div>
      <div style="margin-top:12px"><button class="btn" onclick="addTask()">Add to schedule</button></div>
    </div>
    ${tasks.length ? `<div class="section-title">Timeline</div>
      ${rows}` : '<div class="empty">No activities yet — add the first one above.</div>'}`;
}

/* ---------------- Task detail (planning + daily log) ---------------- */
function renderTaskDetail(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  const pd = state.pdata[p.id];
  const t = pd.tasks.find(x=>x.id===state.currentTaskId);
  if(!t){ state.currentTaskId=null; return renderScheduleTab(); }
  const c = taskCalc(t);
  const logs = (t.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));

  const logRows = logs.map(l=>`<tr>
      <td>${fmtDate(l.date)}</td><td class="num">${l.qty} ${esc(t.unit)}</td>
      <td style="color:var(--ink-soft);font-size:12px">${esc(l.by||'—')}</td>
      <td>${delBtn(`deleteLog('${l.id}')`)}</td>
    </tr>`).join('');

window.addLog = async function(taskId){
  const date = document.getElementById('l_date').value;
  const qty = document.getElementById('l_qty').value;
  if(!date || !qty) return alert('Both date and quantity are required.');
  const pd = state.pdata[state.currentProjectId];
  const t = pd.tasks.find(x=>x.id===taskId);
  const existing = t.logs.find(l=>l.date===date);
  if(existing){ existing.qty = qty; existing.by = whoami(); } else { t.logs.push({id:uid(), date, qty, by:whoami()}); }
  await savePData(state.currentProjectId);
  render();
};
window.deleteLog = async function(logId){
  if(!canDelete()){ alert('Only the admin can delete.'); return; }
  const pd = state.pdata[state.currentProjectId];
  const t = pd.tasks.find(x=>x.id===state.currentTaskId);
  const removed = t.logs.find(l=>l.id===logId);
  t.logs = t.logs.filter(l=>l.id!==logId);
  trashPush(pd, 'log', {taskId:t.id, log:removed}, 'Log entry ('+(removed?removed.date:'')+')');
  await savePData(state.currentProjectId);
  pushUndo('log', state.currentProjectId, removed, item=>{ t.logs.push(item); }, 'Log entry ('+(removed?removed.date:'')+')');
  render();
};

/* ---------------- Budget (BOQ) ---------------- */
function boqBilledSummary(pd, boqId){
  const entries = (pd.billing||[]).filter(b=>b.boqItemId===boqId);
  const qty = entries.reduce((s,e)=>s+(Number(e.qty)||0), 0);
  return {qty, count: entries.length};
}
function renderBudgetTab(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  const pd = state.pdata[p.id];
  const items = pd.boq||[];
  let totEst=0, totAct=0, totBilled=0;
  const rows = items.map(it=>{
    const est = (Number(it.qty)||0)*(Number(it.rate)||0);
    const act = (Number(it.aqty)||0)*(Number(it.arate)||0);
    const bs = boqBilledSummary(pd, it.id);
    const billed = bs.qty*(Number(it.rate)||0);
    const pendingBill = est - billed;
    totEst+=est; totAct+=act; totBilled+=billed;
    const variance = est-act;
    return `<tr>
      <td>${esc(it.item)}</td><td>${esc(it.unit)}</td>
      <td class="num">${it.qty}</td><td class="num">${fmtINR(it.rate)}</td>
      <td class="num">${fmtINR(est)}</td>
      <td class="num"><input type="number" style="width:64px" value="${it.aqty||0}" onchange="updateBoqField('${it.id}','aqty',this.value)"/></td>
      <td class="num">${fmtINR(act)}</td>
      <td class="num ${variance<0?'row-neg':'row-pos'}">${fmtINR(variance)}</td>
      <td class="num">${bs.qty} ${esc(it.unit)}${bs.count?` <span style="color:var(--ink-soft);font-size:10.5px">(${bs.count} bill${bs.count>1?'s':''})</span>`:''}</td>
      <td class="num">${fmtINR(billed)}</td>
      <td class="num ${pendingBill>0?'row-neg':'row-pos'}">${fmtINR(pendingBill)}</td>
      <td style="color:var(--ink-soft);font-size:11.5px">${esc(it.lastEditedBy||it.addedBy||'—')}</td>
      <td style="white-space:nowrap"><button class="btn-ghost btn btn-sm" onclick="goToBillingFor('${it.id}')">Bill</button> ${delBtn(`deleteBoq('${it.id}')`)}</td>
    </tr>`;
  }).join('');
  const overCap = p.value && totEst > Number(p.value);
  return `<div class="topbar"><div><div class="page-title">Budget — ${esc(p.name)}</div><div class="page-sub">Contract value ${fmtINR(p.value)}${overCap?' — <span style="color:var(--warn)">BOQ exceeds contract value</span>':''}</div></div>${projectSelectorHTML()}</div>
    <div class="card">
      <div class="toolbar"><b style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;">Add BOQ item</b></div>
      <div class="form-grid">
        <div><label>Item description</label><input id="b_item" placeholder="e.g. RCC M25 footing"/></div>
        <div><label>Unit</label><input id="b_unit" placeholder="cum / sqm / nos"/></div>
        <div><label>Est. Qty</label><input id="b_qty" type="number"/></div>
        <div><label>Est. Rate (₹)</label><input id="b_rate" type="number"/></div>
        <div><label>Actual Qty (so far)</label><input id="b_aqty" type="number" value="0"/></div>
        <div><label>Actual Rate (₹)</label><input id="b_arate" type="number" value="0"/></div>
      </div>
      <div style="margin-top:12px"><button class="btn" onclick="addBoq()">Add BOQ item</button></div>
    </div>
    ${items.length ? `<div style="margin-bottom:14px;display:flex;gap:8px"><button class="btn btn-sm" onclick="openPlanModal()">⚡ Auto-plan schedule from BOQ</button><button class="btn-ghost btn btn-sm" onclick="setTab('billing')">₹ Go to Billing</button></div>` : ''}
    ${items.length ? `<div style="overflow:auto"><table><thead><tr><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Estimated</th><th class="num">Actual Qty</th><th class="num">Actual Amt</th><th class="num">Variance</th><th class="num">Billed Qty</th><th class="num">Billed Amt</th><th class="num">Pending Bill</th><th>Last edited by</th><th></th></tr></thead>
      <tbody>${rows}<tr class="totrow"><td colspan="4">TOTAL</td><td class="num">${fmtINR(totEst)}</td><td></td><td class="num">${fmtINR(totAct)}</td><td class="num">${fmtINR(totEst-totAct)}</td><td></td><td class="num">${fmtINR(totBilled)}</td><td class="num">${fmtINR(totEst-totBilled)}</td><td></td><td></td></tr></tbody></table></div>`
      : '<div class="empty">No BOQ items yet — add the first one above.</div>'}`;
}
window.goToBillingFor = function(boqId){ state.currentTab='billing'; state.billingPreselect = boqId; render(); };
window.addBoq = async function(){

/* ---------------- Billing (dated entries per BOQ item, with history) ---------------- */
function renderBillingTab(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  const pd = state.pdata[p.id];
  const boqItems = pd.boq||[];
  if(!boqItems.length){
    return `<div class="topbar"><div><div class="page-title">Billing — ${esc(p.name)}</div><div class="page-sub">Track client billing against BOQ</div></div>${projectSelectorHTML()}</div>
      <div class="empty">Add BOQ items in the Budget tab first — billing is logged against a BOQ item.</div>`;
  }
  const entries = (pd.billing||[]).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const itemName = (id)=>{ const it = boqItems.find(x=>x.id===id); return it ? it.item : '(deleted item)'; };
  const itemUnit = (id)=>{ const it = boqItems.find(x=>x.id===id); return it ? it.unit : ''; };
  const rows = entries.map(e=>`<tr>
    <td>${fmtDate(e.date)}</td>
    <td>${esc(itemName(e.boqItemId))}</td>
    <td class="num">${e.qty} ${esc(itemUnit(e.boqItemId))}</td>
    <td>${esc(e.billNo||'—')}</td>
    <td style="color:var(--ink-soft);font-size:12px">${esc(e.by||'—')}</td>
    <td>${delBtn(`deleteBilling('${e.id}')`)}</td>
  </tr>`).join('');
  const preselect = state.billingPreselect || '';
  const options = boqItems.map(it=>{
    const bs = boqBilledSummary(pd, it.id);
    return `<option value="${it.id}" ${it.id===preselect?'selected':''}>${esc(it.item)} — billed ${bs.qty}/${it.qty} ${esc(it.unit)}</option>`;
  }).join('');
  return `<div class="topbar"><div><div class="page-title">Billing — ${esc(p.name)}</div><div class="page-sub">Client billing history, item-wise</div></div>${projectSelectorHTML()}</div>
    <div class="card">
      <div class="toolbar"><b style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;">Log a billing entry</b></div>

        <div><label>Qty billed</label><input id="bl_qty" type="number"/></div>
        <div><label>Bill / RA No. (optional)</label><input id="bl_billno" placeholder="e.g. RA-3"/></div>
      </div>
      <div style="margin-top:12px"><button class="btn" onclick="addBilling()">Add billing entry</button></div>
    </div>
    ${entries.length ? `<table><thead><tr><th>Date</th><th>Item</th><th class="num">Qty billed</th><th>Bill No.</th><th>Logged by</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">No billing entries yet — log the first one above.</div>'}`;
}

    ${items.length ? `<table><thead><tr><th>Date</th><th class="num">Labour</th><th class="num">Equip. hrs</th><th>Progress</th><th>Issues</th><th>Logged by</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">No DPR entries yet.</div>'}`;
}
window.saveQuickLog = async function(taskId){
  const el = document.getElementById('q_'+taskId);
  const val = el ? el.value : '';
  if(val===''||val==null) return;
  const pd = state.pdata[state.currentProjectId];
  const t = pd.tasks.find(x=>x.id===taskId);
  const date = isoDate(new Date());
  const existing = t.logs.find(l=>l.date===date);
  if(existing){ existing.qty = val; existing.by = whoami(); } else { t.logs.push({id:uid(), date, qty:val, by:whoami()}); }
  await savePData(state.currentProjectId);
  render();
};
window.addDpr = async function(){
  const date = document.getElementById('d_date').value;
  const labour = document.getElementById('d_labour').value;
  const equipHours = document.getElementById('d_equip').value;
  const note = document.getElementById('d_note').value.trim();
  const issues = document.getElementById('d_issues').value.trim();
  if(!date || !note) return alert('Date and progress note are required.');
  const pd = state.pdata[state.currentProjectId];
  pd.dpr.push({id:uid(), date, labour:labour||0, equipHours:equipHours||0, note, issues, by:whoami()});
  await savePData(state.currentProjectId);
  render();
};
window.deleteDpr = async function(id){
  if(!canDelete()){ alert('Only the admin can delete.'); return; }
  const pd = state.pdata[state.currentProjectId];
  const removed = pd.dpr.find(d=>d.id===id);
  pd.dpr = pd.dpr.filter(d=>d.id!==id);
  trashPush(pd, 'dpr', removed, removed?('DPR entry '+removed.date):'DPR entry');
  await savePData(state.currentProjectId);
  pushUndo('dpr', state.currentProjectId, removed, item=>{ pd.dpr.push(item); }, removed?('DPR entry '+removed.date):'DPR entry');
  render();
};

  if(state.modal.type==='editproject'){
    const p = state.projects.find(x=>x.id===state.modal.projectId);

        <div style="margin-top:10px"><label>Project type</label><select id="ep_type">${PROJECT_TYPES.map(t=>`<option ${t===p.projectType?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="form-grid" style="margin-top:10px">
          <div><label>Location</label><input id="ep_loc" value="${esc(p.location||'')}"/></div>

        </div>

        <div class="modal-actions">

          <button class="btn" onclick="saveEditProject('${p.id}')">Save changes</button>
        </div>
      </div>
    </div>`;
  }
  if(state.modal.type==='newproject'){
    return `<div class="modal-back" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>New Project</h3>
        <div><label>Project name</label><input id="np_name" placeholder="e.g. Boundary Wall — Sector 12"/></div>
        <div style="margin-top:10px"><label>Project type</label><select id="np_type">${PROJECT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:4px">This makes BOQ auto-plan use the correct construction sequence (e.g. GSB→WMM→DBM→BC for Road, or Excavation→PCC→Column→Brickwork for Boundary Wall).</div></div>
        <div class="form-grid" style="margin-top:10px">
          <div><label>Location</label><input id="np_loc" placeholder="City / State"/></div>
          <div><label>Contract value (₹)</label><input id="np_val" type="number" placeholder="e.g. 15000000"/></div>
          <div><label>Start date</label><input id="np_start" type="date"/></div>
          <div><label>End date</label><input id="np_end" type="date"/></div>
        </div>
        <div style="margin-top:10px"><label>Status</label><select id="np_status">${STATUS_OPTS.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="modal-actions">
          <button class="btn-ghost btn" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="createProject()">Create project</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}
/* ---------------- Modal: Auto-plan schedule from BOQ ---------------- */
function currentProjectType(){
  const p = state.projects.find(x=>x.id===state.currentProjectId);
  return (p && p.projectType) || 'Building';
}
function initPlanDraft(items){
  state.planDraft = {};
  items.forEach(it=>{ state.planDraft[it.id] = guessOutputRate(it.item, it.unit); });
  if(!state.planStart) state.planStart = isoDate(new Date());
  if(!state.planMode) state.planMode = 'sequential';
}
function planDays(it,d){
  const qty=Number(it.qty)||0, target=(Number(d.outputRate)||0)*(Number(d.resources)||0);
  return target>0 ? Math.ceil(qty/target) : '—';
}
window.openPlanModal = function(){
  const pd = state.pdata[state.currentProjectId];
  const items = orderedBoqItems(pd, currentProjectType());
  if(!items.length) return alert('Add BOQ items with quantity first.');
  initPlanDraft(items);
  state.modal = {type:'planboq'};
  render();
};
window.updatePlanDraft = function(id, key, val){
  state.planDraft[id][key] = Number(val)||0; render();
};
function renderPlanModal(){
  const pd = state.pdata[state.currentProjectId];
  const ptype = currentProjectType();
  const items = orderedBoqItems(pd, ptype); // construction-sequence order, not upload order
  if(!state.planDraft) initPlanDraft(items);
  const rows = items.map((it,i)=>{
    const d = state.planDraft[it.id];
    return `<tr>
      <td class="num" style="color:var(--ink-soft)">${i+1}</td>
      <td>${esc(it.item)}</td>
      <td class="num">${it.qty} ${esc(it.unit)}</td>
      <td><input type="number" style="width:64px" value="${d.outputRate}" onchange="updatePlanDraft('${it.id}','outputRate',this.value)"/></td>
      <td><input type="number" style="width:54px" value="${d.resources}" onchange="updatePlanDraft('${it.id}','resources',this.value)"/></td>
      <td class="num">${planDays(it,d)} d</td>
    </tr>`;
  }).join('');
  return `<div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="width:600px">
      <h3>Auto-plan schedule from BOQ <span style="font-size:11px;color:var(--ink-soft);font-weight:500;">— ${esc(ptype)}</span></h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">The correct construction sequence for this project type (${esc(ptype)}) has been applied, curing/setting lag has been added after concrete/masonry items, and activities that directly drive the project finish date get a <b>CP</b> (Critical Path) tag in the Schedule tab. Output rate/resources are estimates — edit as needed.</div>
      <div class="form-grid">
        <div><label>Project start date</label><input type="date" value="${state.planStart}" onchange="state.planStart=this.value;render()"/></div>
        <div><label>Scheduling mode</label><select onchange="state.planMode=this.value;render()">
          <option value="sequential" ${state.planMode==='sequential'?'selected':''}>Sequential (one activity after another — single crew)</option>
          <option value="stage" ${state.planMode==='stage'?'selected':''}>Stage-wise (same-stage work in parallel, separate crews)</option>
        </select></div>
      </div>
      <div style="max-height:280px;overflow:auto;margin-top:12px">
        <table><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th>Output/day</th><th>Resources</th><th class="num">Days</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost btn" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="generatePlanFromBoq()">Generate schedule</button>
      </div>
    </div>
  </div>`;
}
window.generatePlanFromBoq = async function(){
  const pd = state.pdata[state.currentProjectId];
  const ptype = currentProjectType();
  const items = orderedBoqItems(pd, ptype); // already in construction-sequence order

  // group consecutive same-stage items together (needed for stage-wise mode + float calc)
  const groups = [];
  items.forEach(it=>{
    const st = getStage(it.item, ptype);
    const last = groups[groups.length-1];
    if(!last || last.stage!==st) groups.push({stage:st, items:[it]});
    else last.items.push(it);
  });

  let cursor = new Date(state.planStart);
  const results = []; // {it, d, days, startDate, critical, floatDays}

  if(state.planMode==='stage'){
    groups.forEach(g=>{
      const groupStart = new Date(cursor);
      let groupEnd = new Date(groupStart);
      const rowsG = g.items.map(it=>{
        const d = state.planDraft[it.id];
        const target = (Number(d.outputRate)||0)*(Number(d.resources)||0);
        const days = target>0 ? Math.ceil((Number(it.qty)||0)/target) : 1;
        const end = new Date(groupStart); end.setDate(end.getDate()+days);
        if(end>groupEnd) groupEnd = end;
        return {it, d, days, startDate:groupStart, end};
      });
      rowsG.forEach(r=>{
        const floatDays = Math.round((groupEnd - r.end)/86400000);
        results.push({it:r.it, d:r.d, startDate:r.startDate, floatDays, critical: floatDays===0});
      });
      const maxLag = Math.max(0, ...g.items.map(it=>getCuringLag(it.item)));
      cursor = new Date(groupEnd); cursor.setDate(cursor.getDate()+maxLag);
    });
  } else {
    // fully sequential — one activity strictly after the previous one (+ curing lag)
    items.forEach(it=>{
      const d = state.planDraft[it.id];
      const target = (Number(d.outputRate)||0)*(Number(d.resources)||0);
      const days = target>0 ? Math.ceil((Number(it.qty)||0)/target) : 1;
      const startDate = new Date(cursor);
      const end = new Date(startDate); end.setDate(end.getDate()+days);
      const lag = getCuringLag(it.item);
      cursor = new Date(end); cursor.setDate(cursor.getDate()+lag);
      results.push({it, d, startDate, floatDays:0, critical:true});
    });
  }

  results.forEach(({it, d, startDate, floatDays, critical})=>{
    const startIso = isoDate(startDate);
    const existing = pd.tasks.find(t=>t.boqId===it.id);
    if(existing){
      existing.name=it.item; existing.qty=it.qty; existing.unit=it.unit;
      existing.outputRate=d.outputRate; existing.resources=d.resources; existing.start=startIso;
      existing.critical=critical; existing.floatDays=floatDays;
    } else {
      pd.tasks.push({id:uid(), boqId:it.id, name:it.item, qty:it.qty, unit:it.unit,
        outputRate:d.outputRate, resources:d.resources, start:startIso, logs:[],
        critical, floatDays});
    }
  });
  await savePData(state.currentProjectId);
  state.modal = null; state.planDraft = null;
  state.currentTab = 'schedule';
  render();
};

window.createProject = async function(){
  const name = document.getElementById('np_name').value.trim();
  const projectType = document.getElementById('np_type').value;
  const location = document.getElementById('np_loc').value.trim();
  let value = Number(document.getElementById('np_val').value)||0;
  const startDate = document.getElementById('np_start').value;
  const endDate = document.getElementById('np_end').value;
  const status = document.getElementById('np_status').value;
  if(!name) return alert('Project name is required.');
  const id = uid();
  state.projects.push({id, name, projectType, location, value, startDate, endDate, status, createdBy: whoami()});
  state.pdata[id] = emptyPData();
  await saveProjects();
  await savePData(id);
  state.modal = null;
  render();
};

function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadAppData(){
  document.getElementById('app').innerHTML = '<div style="padding:40px;font-family:var(--font-body);color:var(--ink-soft)">Loading…</div>';
  await loadProjects();
  if(state.loadError){
    document.getElementById('app').innerHTML = `<div style="padding:40px;font-family:var(--font-body);max-width:560px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:10px">⚠ Couldn't reach the database</div>
      <div style="color:var(--ink-soft);font-size:13px;line-height:1.6">${esc(state.loadError)}</div>
      <div style="margin-top:14px"><button class="btn" onclick="location.reload()">Retry</button></div></div>`;
    return;
  }
  for(const p of state.projects){ await loadPData(p.id); }
  if(state.projects.length===0){
    let seeded = false;
    try{
      if(HAS_ARTIFACT_STORAGE){
        try{ const r = await window.storage.get('seeded_v1', false); seeded = !!(r && r.value); }
        catch(notFound){ seeded = false; } // key doesn't exist yet — normal, not an error
      } else if(db){
        const snap = await withTimeout(db.collection('meta').doc('seeded').get(), 6000, 'seeded-check'); seeded = snap.exists && snap.data().done;
      }
    }catch(e){ seeded = false; state.loadError = e.message; }
    if(!seeded && !state.loadError){
      await importGraphonetSeed();
      try{
        if(HAS_ARTIFACT_STORAGE){ await window.storage.set('seeded_v1', '1', false); }
        else if(db){ await withTimeout(db.collection('meta').doc('seeded').set({done:true}), 6000, 'seeded-write'); }
      }catch(e){}
    }
  }
  if(state.loadError){
    document.getElementById('app').innerHTML = `<div style="padding:40px;font-family:var(--font-body);max-width:560px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:10px">⚠ Couldn't reach the database</div>
      <div style="color:var(--ink-soft);font-size:13px;line-height:1.6">${esc(state.loadError)}</div>
      <div style="margin-top:14px"><button class="btn" onclick="location.reload()">Retry</button></div></div>`;
    return;
  }
  if(state.currentUser && state.currentUser.isAdmin){ await loadPendingUsers(); }
  if(canDelete()){ await loadGlobalTrash(); }
  render();
}

(async function boot(){
  document.getElementById('app').innerHTML = '<div style="padding:40px;font-family:var(--font-body);color:var(--ink-soft)">Loading…</div>';
  if(!HAS_ARTIFACT_STORAGE && !db){
    document.getElementById('app').innerHTML = `<div style="padding:40px;font-family:var(--font-body);max-width:520px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:10px">⚠ Can't connect to Firebase</div>
      <div style="color:var(--ink-soft);font-size:13px;line-height:1.6">This usually means either the internet connection dropped while loading the Firebase SDK, or the config in FIREBASE_CONFIG hasn't been filled in correctly yet.<br/><br/>
      Check your internet connection and refresh. If that doesn't help, open the browser's developer console (F12) and look for the exact error message.</div></div>`;
    return;
  }
  if(HAS_ARTIFACT_STORAGE){
    await loadAppData();
    return;
  }
  let profileUnsub = null;
  auth.onAuthStateChanged(async (user)=>{
    if(profileUnsub){ try{ profileUnsub(); }catch(e){} profileUnsub = null; }
    if(!user){ state.currentUser = null; render(); return; }
    const isAdmin = (user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase();
    let profile = null;
    try{
      const snap = await withTimeout(db.collection('users').doc(user.uid).get(), 6000, 'load-profile');
      profile = snap.exists ? snap.data() : null;
    }catch(e){ console.error('load profile failed', e); }
    if(!profile){
      profile = {name: user.displayName || user.email, email: user.email, status: isAdmin ? 'approved' : 'pending', requestedAt: new Date().toISOString()};
      try{ await withTimeout(db.collection('users').doc(user.uid).set(profile), 6000, 'create-profile'); }catch(e){}
    } else if(isAdmin && profile.status!=='approved'){
      profile.status = 'approved';
      try{ await withTimeout(db.collection('users').doc(user.uid).set({status:'approved'}, {merge:true}), 6000, 'admin-auto-approve'); }catch(e){}
    }
    state.currentUser = {uid:user.uid, email:user.email, displayName: user.displayName || profile.name, status: profile.status, isAdmin};
    // Live-watch this user's own approval status — so an admin blocking/approving someone
    // takes effect immediately for that person, without needing to log out and back in.
    try{
      profileUnsub = db.collection('users').doc(user.uid).onSnapshot(snap=>{
        if(!snap.exists || !state.currentUser) return;
        const newStatus = snap.data().status;
        if(newStatus !== state.currentUser.status){
          const wasApproved = state.currentUser.status === 'approved';
          state.currentUser.status = newStatus;
          if(newStatus==='approved' && !wasApproved){ loadAppData(); }
          else if(newStatus!=='approved'){ render(); }
        }
      });
    }catch(e){}
    if(profile.status==='approved'){ await loadAppData(); }
    else { render(); }
  });
})();
</script>
